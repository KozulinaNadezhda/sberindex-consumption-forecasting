project:
  name: "sberindex_consumption_forecasting"
  version: "1.0.0"
  random_seed: 42

data:
  main_dataset_path: "potrebitelskie-beznalicnye-rashody-na-urovne-munizipalnyh-obrazovanij_ru_1764079373653.csv"
  macro_dataset_path: "consumer-spending.csv"
  processed_output_path: "final_data_for_app.csv"
  metrics_output_path: "metrics.json"
  model_output_path: "sber_model.cbm"
  prophet_evidence_path: "prophet_evidence.csv"
  horizons_output_path: "horizons_benchmark.csv"
  districts_output_path: "benchmark_districts_comparison.csv"

validation:
  horizons: [1, 3, 6, 12]
  primary_horizon_months: 6
  benchmark_district: "Октябрьский муниципальный район"

features:
  numerical:
    - "year"
    - "month"
    - "sin_month"
    - "cos_month"
    - "is_december"
    - "is_january"
    - "macro_value"
    - "usd"
    - "macro_per_usd"
    - "news_sentiment"
    - "is_shock_regime"
    - "mo_momentum"
    - "mo_volatility"
    - "log_baseline"
    - "december_elasticity"
  target: "value"
  target_scaled: "target_ratio"

catboost_params:
  iterations: 700
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0
  loss_function: "RMSE"
  eval_metric: "RMSE"
  random_seed: 42
  verbose: False

changepoint_detection:
  algorithm: "Window"
  window_width: 3
  model: "l2"
  num_breakpoints: 2